name: Valider et déployer le Quiz PSE

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  # Contrôles automatiques : banque de questions valide et lots sans répétition.
  # Une branche ou une PR qui échoue ici n'est jamais publiée.
  validate:
    name: Contrôler la banque de questions
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installer les dépendances de test
        run: npm install --no-audit --no-fund

      - name: Contrôler la banque de questions
        run: npm run validate

      - name: Vérifier l'absence de répétition dans les lots
        run: npm run test:lot

      - name: Vérifier la cohérence de l'interface
        run: npm run test:ui

      - name: Vérifier que questions.js correspond à data/questions.json
        run: python3 tools/generate_questions_js.py --check

      - name: Test de bout en bout dans un navigateur simulé
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/dev/null 2>&1 &
          sleep 2
          node tools/e2e.mjs http://127.0.0.1:8080/

  deploy:
    name: Publier sur GitHub Pages
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      # Le site est publié par ce workflow et non par l'ancienne source
      # « branche » (arena/01a0e8b9-quiz). On aligne le réglage s'il a été
      # modifié à la main : l'appel ne fait rien une fois le réglage en place.
      - name: Aligner la source Pages sur GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type="$(gh api "repos/${{ github.repository }}/pages" --jq .build_type)"
          if [ "$build_type" != "workflow" ]; then
            echo "Source Pages actuelle : $build_type → bascule sur « GitHub Actions »"
            gh api -X PUT "repos/${{ github.repository }}/pages" -f build_type=workflow
          else
            echo "Source Pages déjà réglée sur « GitHub Actions »"
          fi

      - name: Configurer Pages
        uses: actions/configure-pages@v5

      # Seuls les fichiers utiles au site sont publiés : l'outillage
      # (tools/, data/) et l'historique restent dans le dépôt.
      - name: Préparer le site
        run: |
          mkdir -p _site
          cp index.html styles.css app.js questions.js sw.js manifest.webmanifest icon.svg _site/
          cp -r icons assets _site/

      - name: Envoyer l'artefact du site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ⚠️ Job TEMPORAIRE de diagnostic : à retirer avant la fusion.
  diag-pages:
    name: Diagnostic Pages (temporaire)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Interroger l'API Pages
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          emit() { echo "::error title=DIAG::$1"; }
          emit "ref=${{ github.ref }}"
          if command -v gh >/dev/null 2>&1; then emit "gh=$(gh --version | head -1)"; else emit "gh=ABSENT"; fi
          perms="$(gh api "repos/$REPO/actions/permissions/workflow" 2>&1 | tr '\n' '~' | cut -c1-300 || true)"
          emit "workflow-perms|$perms"
          get_out="$(gh api "repos/$REPO/pages" --include 2>&1 | tr '\n' '~' | cut -c1-900 || true)"
          emit "GET|$get_out"
          put_out="$(gh api -X PUT "repos/$REPO/pages" -f build_type=workflow --include 2>&1 | tr '\n' '~' | cut -c1-900 || true)"
          emit "PUT|$put_out"
