<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A192F"><meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg">
<title>Quiz PSE — Protection Civile du Lot</title>
<style>
:root{--o:#ff6600;--n:#071426;--m:#a9b9ce;--g:#18d69a;--r:#ff5264}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,sans-serif;color:#fff;background:radial-gradient(circle at 10% 0%,#ff66002b,transparent 30%),linear-gradient(150deg,#061121,#0a192f 55%,#001d45)}button{font:inherit}.app{width:min(760px,100%);margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{display:flex;align-items:center;gap:10px}.cross{display:grid;place-items:center;width:40px;height:40px;border-radius:11px;background:var(--o);font-size:22px}.brand small{display:block;color:var(--m);font-size:10px;text-transform:uppercase;letter-spacing:1px}.brand b{font-size:14px}.home{border:1px solid #ffffff24;background:#ffffff0d;color:#fff;border-radius:12px;padding:9px 12px}.hero{text-align:center;padding:18px 4px}.hero h1{margin:0;font-size:clamp(42px,13vw,70px);line-height:.95}.hero h1 span{color:var(--o)}.hero p{color:var(--m);font-size:14px}.card{background:#ffffff0d;border:1px solid #ffffff17;border-radius:20px;box-shadow:0 16px 50px #0004;backdrop-filter:blur(10px)}.start{padding:20px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}.stat{text-align:center;padding:14px 5px;background:#ffffff0d;border-radius:14px}.stat b{display:block;font-size:24px}.stat span{color:var(--m);font-size:10px;text-transform:uppercase}.primary{width:100%;border:0;border-radius:15px;padding:15px;background:linear-gradient(135deg,#ff761d,#e55300);color:#fff;font-weight:800;cursor:pointer}.hidden{display:none!important}.progress{height:7px;background:#ffffff1a;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--o),#ff9a58)}.meta{display:flex;justify-content:space-between;align-items:center;color:var(--m);font-size:12px;margin:9px 2px 12px}.timer{display:grid;place-items:center;width:44px;height:44px;border:3px solid var(--o);border-radius:50%;font-weight:800}.warn{border-color:var(--r);color:#ff9aa5}.question{padding:20px 18px;margin-bottom:10px;border-left:4px solid var(--o)}.tag{display:inline-block;padding:5px 9px;border-radius:8px;background:#ff660021;color:#ffad7b;font-size:10px;font-weight:800;text-transform:uppercase}.question h2{font-size:clamp(19px,5vw,25px);line-height:1.4;margin:10px 0 0}.qillustration{margin:-20px -18px 16px;overflow:hidden;border-radius:20px 20px 0 0;background:linear-gradient(135deg,#102544,#0b1830);border-bottom:1px solid #ffffff12}.qillustration svg{display:block;width:100%;height:170px}.qillustration .ill-label{font:700 11px system-ui,sans-serif;letter-spacing:1.5px;text-transform:uppercase;fill:#b8c8dc}.qillustration .ill-main{font:800 54px system-ui,sans-serif}.answers{display:grid;gap:9px}.answer{display:flex;align-items:center;gap:11px;width:100%;min-height:60px;padding:11px 13px;text-align:left;border:1px solid #ffffff1c;border-radius:15px;background:#ffffff0d;color:#fff}.letter{flex:0 0 35px;height:35px;display:grid;place-items:center;border-radius:9px;background:#ffffff12;font-weight:800}.answer.correct{border-color:var(--g);background:#18d69a1f}.answer.correct .letter{background:var(--g);color:#06251c}.answer.wrong{border-color:var(--r);background:#ff52641a}.answer:disabled{cursor:default}.feedback{margin:11px 0;padding:14px 15px;border-radius:14px;background:#ffffff0d;line-height:1.45;font-size:14px}.feedback.good{border:1px solid #18d69a59}.feedback.bad{border:1px solid #ff526459}.next{margin-top:10px}.done{text-align:center;padding:32px 20px}.done h2{font-size:28px}.done p{color:var(--m);line-height:1.5}.foot{text-align:center;color:var(--m);font-size:11px;margin-top:18px}
</style></head><body><main class="app">
<header class="top"><div class="brand"><div class="cross">✚</div><div><small>Protection Civile</small><b>du Lot · PSE1</b></div></div><button class="home" onclick="goHome()">⌂ Accueil</button></header>
<section id="home"><div class="hero"><h1>QUIZ <span>PSE</span></h1><p>Entraînement PSE1 — 20 questions aléatoires</p></div><div class="card start"><div class="stats"><div class="stat"><b id="bank">20</b><span>Questions</span></div><div class="stat"><b>30s</b><span>Par question</span></div><div class="stat"><b>✓</b><span>Correction</span></div></div><button class="primary" onclick="startQuiz()">🚀 Nouveau quiz — 20 questions</button></div></section>
<section id="quiz" class="hidden"><div class="progress"><i id="bar"></i></div><div class="meta"><span id="num">Question 1 / 20</span><span class="timer" id="timer">30</span></div><div class="card question"><div class="tag" id="cat">PSE1</div><h2 id="q"></h2></div><div class="answers" id="answers"></div><div id="feedback" class="feedback hidden"></div><button id="next" class="primary next hidden" onclick="nextQuestion()">Question suivante →</button></section>
<section id="done" class="hidden"><div class="card done"><div style="font-size:54px">🎉</div><h2>Les 20 questions sont terminées</h2><p>La session d'entraînement est terminée.</p><button class="primary" onclick="goHome()">🔁 Recommencer</button></div></section>
<div class="foot">Quiz PSE1 · Protection Civile du Lot</div></main>
<script src="./questions.js"></script><script>
const TOTAL=20,TIME=30,L=["A","B","C","D"];let qs=[],cur=0,timer=null,left=TIME,answered=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function show(id){["home","quiz","done"].forEach(x=>document.getElementById(x).classList.toggle("hidden",x!==id))}
function goHome(){clearInterval(timer);show("home");scrollTo(0,0)}
function startQuiz(){
  let bank=typeof QUESTION_BANK!=="undefined"?QUESTION_BANK:[];
  if(bank.length<TOTAL)return;
  let previous=[];
  try{previous=JSON.parse(localStorage.getItem("quizPSEPrevious")||"[]")}catch(e){}
  let pool=shuffle([...bank]);
  let chosen=pool.slice(0,TOTAL);
  let previousSet=new Set(previous);
  if(previous.length===TOTAL){
    let attempts=0;
    while(chosen.every(x=>previousSet.has(x.q))&&attempts<20){
      pool=shuffle([...bank]); chosen=pool.slice(0,TOTAL); attempts++;
    }
  }
  qs=chosen.map(x=>{
    let o=x.opts.map((v,i)=>({v,ok:i===x.c}));
    shuffle(o);
    return{cat:x.cat||"PSE1",q:x.q,opts:o.map(z=>z.v),c:o.findIndex(z=>z.ok),e:x.e||""}
  });
  try{localStorage.setItem("quizPSEPrevious",JSON.stringify(qs.map(x=>x.q)))}catch(e){}
  cur=0;show("quiz");render()
}
function illustrationFor(x){
  const c=String(x.cat||"").toLowerCase(), q=String(x.q||"").toLowerCase();
  let icon="✚", title="SECOURS", sub="PSE1";
  if(c.includes("hémorrag")||q.includes("saign")||q.includes("garrot")||q.includes("pansement")){icon="🩸";title="HÉMORRAGIE";sub="PROTÉGER · COMPRIMER · ALERTER"}
  else if(c.includes("rcp")||c.includes("dae")||q.includes("arrêt cardiaque")||q.includes("défibr")){icon="♥";title="RÉANIMATION";sub="RCP · DAE"}
  else if(c.includes("obstruction")||q.includes("étouff")||q.includes("heimlich")){icon="🫁";title="VOIES AÉRIENNES";sub="DÉSOBSTRUCTION"}
  else if(c.includes("neurolog")||q.includes("avpu")||q.includes("pupille")){icon="🧠";title="NEUROLOGIE";sub="ÉVALUATION"}
  else if(c.includes("position latérale")||q.includes("pls")){icon="↻";title="PLS";sub="POSITION DE SÉCURITÉ"}
  else if(c.includes("malaise")||q.includes("avc")||q.includes("hypoglyc")){icon="⚕";title="MALAISE";sub="RECONNAÎTRE · ALERTER"}
  else if(c.includes("traumatisme")||c.includes("immobilisation")||q.includes("fracture")||q.includes("rachis")){icon="🦴";title="TRAUMATISME";sub="IMMOBILISATION"}
  else if(c.includes("brûl")||q.includes("brûl")){icon="🔥";title="BRÛLURE";sub="REFROIDIR · PROTÉGER"}
  else if(c.includes("intox")||q.includes("poison")||q.includes("toxique")){icon="⚠";title="INTOXICATION";sub="ÉLOIGNER · ALERTER"}
  else if(c.includes("matériel")||q.includes("oxyg")){icon="O₂";title="MATÉRIEL";sub="OXYGÉNOTHÉRAPIE"}
  else if(c.includes("attitude")||q.includes("danger")||q.includes("balisage")||q.includes("epi")){icon="🛡";title="PROTECTION";sub="SÉCURISER · ALERTER"}
  const escSvg=v=>String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  return '<svg viewBox="0 0 760 170" role="img" aria-label="'+escSvg(title)+'"><defs><linearGradient id="ig" x1="0" x2="1"><stop offset="0" stop-color="#ff6600"/><stop offset="1" stop-color="#ff9a58"/></linearGradient><radialGradient id="rg"><stop stop-color="#ffffff22"/><stop offset="1" stop-color="#ffffff00"/></radialGradient></defs><rect width="760" height="170" fill="#0b1b33"/><circle cx="650" cy="30" r="145" fill="url(#rg)"/><circle cx="120" cy="150" r="110" fill="#ff660012"/><rect x="28" y="28" width="114" height="114" rx="28" fill="url(#ig)" opacity=".95"/><text x="85" y="103" text-anchor="middle" class="ill-main">'+escSvg(icon)+'</text><text x="175" y="72" class="ill-label">'+escSvg(title)+'</text><text x="175" y="102" fill="#fff" font-size="24" font-weight="800" font-family="system-ui,sans-serif">'+escSvg(sub)+'</text><path d="M175 121h430" stroke="#ffffff22"/><circle cx="625" cy="121" r="5" fill="#ff6600"/><circle cx="645" cy="121" r="5" fill="#ff6600" opacity=".55"/><circle cx="665" cy="121" r="5" fill="#ff6600" opacity=".25"/></svg>';
}
function render(){answered=false;clearInterval(timer);let x=qs[cur];document.getElementById("num").textContent="Question "+(cur+1)+" / "+qs.length;document.getElementById("bar").style.width=(cur/qs.length*100)+"%";document.getElementById("cat").textContent=x.cat;document.getElementById("illustration").innerHTML=illustrationFor(x);document.getElementById("q").textContent=x.q;document.getElementById("feedback").className="feedback hidden";document.getElementById("next").classList.add("hidden");let a=document.getElementById("answers");a.innerHTML="";x.opts.forEach((v,i)=>{let b=document.createElement("button");b.className="answer";b.innerHTML='<span class="letter">'+L[i]+'</span><span>'+esc(v)+'</span>';b.onclick=()=>answer(i);a.appendChild(b)});left=TIME;tick();timer=setInterval(()=>{left--;tick();if(left<=0){clearInterval(timer);answer(-1)}},1000)}
function tick(){let t=document.getElementById("timer");t.textContent=left;t.classList.toggle("warn",left<=10)}
function answer(i){if(answered)return;answered=true;clearInterval(timer);let x=qs[cur];document.querySelectorAll(".answer").forEach((b,k)=>{b.disabled=true;if(k===x.c)b.classList.add("correct");else if(k===i)b.classList.add("wrong")});let f=document.getElementById("feedback");if(i===x.c){f.className="feedback good";f.innerHTML="<b>✅ Bonne réponse.</b> "+esc(x.e)}else if(i===-1){f.className="feedback bad";f.innerHTML="<b>⏰ Temps écoulé.</b> Bonne réponse : <b>"+esc(x.opts[x.c])+"</b><br>"+esc(x.e)}else{f.className="feedback bad";f.innerHTML="<b>❌ Mauvaise réponse.</b> Bonne réponse : <b>"+esc(x.opts[x.c])+"</b><br>"+esc(x.e)}f.classList.remove("hidden");let n=document.getElementById("next");n.textContent=cur<qs.length-1?"Question suivante →":"🏁 Terminer";n.classList.remove("hidden")}
function nextQuestion(){cur++;if(cur>=qs.length){show("done");document.getElementById("bar").style.width="100%"}else render();scrollTo(0,0)}
document.getElementById("bank").textContent=TOTAL;
</script></body></html>
